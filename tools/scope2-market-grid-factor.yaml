name: scope2-market-grid-factor
version: 1.0.0
description: "Applies eGRID regional carbon factor to purchased electricity kilowatt-hours"
input_schema:
  type: object
  properties:
    electricity_json:
      type: string
      description: "JSON with kwh_consumed and grid_factor_kg_per_kwh"
  required:
    - electricity_json
implementation:
  type: script
  path: scope2_market_grid_factor.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
