name: scope1-emission-calculator
version: 1.0.0
description: "Computes metric tonnes CO2e from natural gas and diesel fuel consumption"
input_schema:
  type: object
  properties:
    fuel_data_json:
      type: string
      description: "JSON with natural_gas_therms and diesel_gallons"
  required:
    - fuel_data_json
implementation:
  type: script
  path: scope1_emission_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
