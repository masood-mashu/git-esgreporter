spec_version: "0.1.0"
name: git-esgreporter
version: 1.0.0
description: "Autonomous Corporate ESG Sustainability, Scope 1/2/3 Carbon Accounting & GHG Audit Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - ghg-protocol-corporate-standard
  - epa-emissions-factors

tools:
  - scope1-emission-calculator
  - scope2-market-grid-factor
  - ghg-protocol-certifier

runtime:
  max_turns: 50
  timeout: 120

tags:
  - data-analytics
  - esg-reporting
  - carbon-accounting
  - ghg-protocol
  - passport-challenge

metadata:
  passport_id: "aps-esgreporter-01"
  passport_category: "Data & analytics"
